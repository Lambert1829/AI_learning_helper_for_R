services:
  - type: web
    name: r-learning-helper
    runtime: python
    plan: free
    region: singapore
    rootDir: .
    buildCommand: python render_service.py build
    startCommand: python render_service.py start
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: APP_ENV
        value: production
