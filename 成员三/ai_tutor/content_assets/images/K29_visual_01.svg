<svg xmlns="http://www.w3.org/2000/svg" width="720" height="626" viewBox="0 0 720 626" role="img" aria-labelledby="title desc">
<title id="title">K29 宽表与长表</title>
<desc id="desc">左侧宽表两行：A的2025、2026成绩为80、90，B为70、85。右侧长表四行，每行包含id、year、score。中间箭头表示reshape转长与转宽，一条连线把宽表中A的2026成绩90连到长表中A.2026这一行。</desc>
