<svg xmlns="http://www.w3.org/2000/svg" width="720" height="756" viewBox="0 0 720 756" role="img" aria-labelledby="title desc">
<title id="title">K26 取列的三种写法</title>
<desc id="desc">左侧数据框有id和score两列。右侧第一、二行显示用美元符号和双中括号取列都得到向量80、NA、90；第三行显示用单中括号加列名得到仍有表头score和行号1到3的数据框。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#79bdf1" stroke-width="1.5"/></marker></defs>
<rect width="720" height="756" rx="20" fill="#030813"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#b7c5d4">
<text x="36" y="62" font-size="32" font-weight="700" fill="#f5f9ff">K26 取列的三种写法</text>
<rect x="36" y="110" width="90" height="48" rx="8" fill="#0f2236" stroke="#294158" stroke-width="2"/>
<text x="81.0" y="142.0" font-size="22" fill="#79bdf1" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">id</text>
<rect x="132" y="110" width="90" height="48" rx="8" fill="#0f2236" stroke="#79bdf1" stroke-width="2"/>
<text x="177.0" y="142.0" font-size="22" fill="#79bdf1" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">score</text>
<rect x="36" y="164" width="90" height="48" rx="8" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="81.0" y="196.0" font-size="22" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">1</text>
<rect x="132" y="164" width="90" height="48" rx="8" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="177.0" y="196.0" font-size="22" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">80</text>
<rect x="36" y="218" width="90" height="48" rx="8" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="81.0" y="250.0" font-size="22" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">2</text>
<rect x="132" y="218" width="90" height="48" rx="8" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="177.0" y="250.0" font-size="22" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">NA</text>
<rect x="36" y="272" width="90" height="48" rx="8" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="81.0" y="304.0" font-size="22" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">3</text>
<rect x="132" y="272" width="90" height="48" rx="8" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="177.0" y="304.0" font-size="22" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">90</text>
<text x="300" y="136" font-size="24" fill="#79bdf1" font-weight="700" font-family="Consolas, Menlo, monospace">d$score</text>
<rect x="300" y="150" width="70" height="46" rx="10" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="335.0" y="182.0" font-size="22" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">80</text>
<rect x="378" y="150" width="70" height="46" rx="10" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="413.0" y="182.0" font-size="22" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">NA</text>
<rect x="456" y="150" width="70" height="46" rx="10" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="491.0" y="182.0" font-size="22" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">90</text>
<text x="560" y="182" font-size="22" fill="#9eafc2">向量</text>
<text x="300" y="246" font-size="24" fill="#79bdf1" font-weight="700" font-family="Consolas, Menlo, monospace">d[["score"]]</text>
<rect x="300" y="260" width="70" height="46" rx="10" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="335.0" y="292.0" font-size="22" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">80</text>
<rect x="378" y="260" width="70" height="46" rx="10" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="413.0" y="292.0" font-size="22" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">NA</text>
<rect x="456" y="260" width="70" height="46" rx="10" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="491.0" y="292.0" font-size="22" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">90</text>
<text x="560" y="292" font-size="22" fill="#9eafc2">向量</text>
<text x="300" y="360" font-size="24" fill="#79bdf1" font-weight="700" font-family="Consolas, Menlo, monospace">d["score"]</text>
<rect x="300" y="374" width="100" height="40" rx="8" fill="#0f2236" stroke="#294158" stroke-width="2"/>
<text x="350.0" y="402.0" font-size="20" fill="#79bdf1" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">score</text>
<rect x="300" y="420" width="100" height="40" rx="8" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="350.0" y="448.0" font-size="20" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">80</text>
<rect x="300" y="466" width="100" height="40" rx="8" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="350.0" y="494.0" font-size="20" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">NA</text>
<rect x="300" y="512" width="100" height="40" rx="8" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="350.0" y="540.0" font-size="20" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">90</text>
<text x="430" y="470" font-size="22" fill="#9eafc2">仍是数据框</text>
<rect x="36" y="600" width="648" height="110" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="644" font-size="28" fill="#79bdf1" font-weight="700">要计算 → 取向量；要保留表 → 单中括号</text>
<text x="58" y="686" font-size="25" fill="#b7c5d4">筛选行时先排除 NA，或用 which()</text>
</g>
</svg>
