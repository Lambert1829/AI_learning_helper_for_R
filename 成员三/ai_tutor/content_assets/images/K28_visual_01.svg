<svg xmlns="http://www.w3.org/2000/svg" width="720" height="716" viewBox="0 0 720 716" role="img" aria-labelledby="title desc">
<title id="title">K28 三种缺失处理的代价</title>
<desc id="desc">三列对比。整表删除只剩1行；按成绩列删除保留4行；均值填补保留5行，但填补值以橙色标出，并注明标准差会变小。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#79bdf1" stroke-width="1.5"/></marker></defs>
<rect width="720" height="716" rx="20" fill="#030813"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#b7c5d4">
<text x="36" y="62" font-size="32" font-weight="700" fill="#f5f9ff">K28 三种缺失处理的代价</text>
<text x="36" y="116" font-size="22" fill="#79bdf1" font-weight="700">整表删除</text>
<text x="36" y="146" font-size="17" fill="#9eafc2" font-family="Consolas, Menlo, monospace">na.omit(d)</text>
<rect x="36" y="170" width="200" height="50" rx="8" fill="#0a0f18" stroke="#3a4658" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="48" y1="195" x2="224" y2="195" stroke="#5b6878" stroke-width="2.5"/>
<rect x="36" y="232" width="200" height="50" rx="8" fill="#0a0f18" stroke="#3a4658" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="48" y1="257" x2="224" y2="257" stroke="#5b6878" stroke-width="2.5"/>
<rect x="36" y="294" width="200" height="50" rx="8" fill="#0a0f18" stroke="#3a4658" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="48" y1="319" x2="224" y2="319" stroke="#5b6878" stroke-width="2.5"/>
<rect x="36" y="356" width="200" height="50" rx="8" fill="#0a0f18" stroke="#3a4658" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="48" y1="381" x2="224" y2="381" stroke="#5b6878" stroke-width="2.5"/>
<rect x="36" y="418" width="200" height="50" rx="8" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="136" y="451" font-size="20" fill="#f5f9ff" font-weight="600" text-anchor="middle">记录 5</text>
<text x="136" y="506" font-size="22" fill="#b7c5d4" font-weight="700" text-anchor="middle">剩 1 行</text>
<text x="258" y="116" font-size="22" fill="#79bdf1" font-weight="700">按分析列删除</text>
<text x="258" y="146" font-size="17" fill="#9eafc2" font-family="Consolas, Menlo, monospace">d[!is.na(d$score), ]</text>
<rect x="258" y="170" width="200" height="50" rx="8" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="358" y="203" font-size="20" fill="#f5f9ff" font-weight="600" text-anchor="middle">记录 1</text>
<rect x="258" y="232" width="200" height="50" rx="8" fill="#0a0f18" stroke="#3a4658" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="270" y1="257" x2="446" y2="257" stroke="#5b6878" stroke-width="2.5"/>
<rect x="258" y="294" width="200" height="50" rx="8" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="358" y="327" font-size="20" fill="#f5f9ff" font-weight="600" text-anchor="middle">记录 3</text>
<rect x="258" y="356" width="200" height="50" rx="8" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="358" y="389" font-size="20" fill="#f5f9ff" font-weight="600" text-anchor="middle">记录 4</text>
<rect x="258" y="418" width="200" height="50" rx="8" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="358" y="451" font-size="20" fill="#f5f9ff" font-weight="600" text-anchor="middle">记录 5</text>
<text x="358" y="506" font-size="22" fill="#b7c5d4" font-weight="700" text-anchor="middle">剩 4 行</text>
<text x="480" y="116" font-size="22" fill="#79bdf1" font-weight="700">保留全部</text>
<text x="480" y="146" font-size="17" fill="#9eafc2" font-family="Consolas, Menlo, monospace">均值填补</text>
<rect x="480" y="170" width="200" height="50" rx="8" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="580" y="203" font-size="20" fill="#f5f9ff" font-weight="600" text-anchor="middle">记录 1</text>
<rect x="480" y="232" width="200" height="50" rx="8" fill="#3a2610" stroke="#f2b56b" stroke-width="2"/>
<text x="580" y="265" font-size="20" fill="#f2b56b" font-weight="700" text-anchor="middle">填补 83.25</text>
<rect x="480" y="294" width="200" height="50" rx="8" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="580" y="327" font-size="20" fill="#f5f9ff" font-weight="600" text-anchor="middle">记录 3</text>
<rect x="480" y="356" width="200" height="50" rx="8" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="580" y="389" font-size="20" fill="#f5f9ff" font-weight="600" text-anchor="middle">记录 4</text>
<rect x="480" y="418" width="200" height="50" rx="8" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="580" y="451" font-size="20" fill="#f5f9ff" font-weight="600" text-anchor="middle">记录 5</text>
<text x="580" y="506" font-size="22" fill="#b7c5d4" font-weight="700" text-anchor="middle">5 行，波动变小</text>
<rect x="36" y="560" width="648" height="110" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="604" font-size="28" fill="#79bdf1" font-weight="700">处理前先加标记列</text>
<text x="58" y="646" font-size="25" fill="#b7c5d4">先存 is.na(d$score)，报告中写明规则</text>
</g>
</svg>
