<svg xmlns="http://www.w3.org/2000/svg" width="720" height="776" viewBox="0 0 720 776" role="img" aria-labelledby="title desc">
<title id="title">K25 数据框：列是变量，行是观测</title>
<desc id="desc">一张3列4行的表，表头为id、major、score，分别标注chr、chr、num。竖向色带标出score整列为数值，横向高亮第一行S01、FIN、88为一个观测。下方箭头指向as.matrix后的结果，所有格子都带引号，表示被统一为字符。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#79bdf1" stroke-width="1.5"/></marker></defs>
<rect width="720" height="776" rx="20" fill="#030813"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#b7c5d4">
<text x="36" y="62" font-size="32" font-weight="700" fill="#f5f9ff">K25 数据框：列是变量，行是观测</text>
<text x="111" y="112" font-size="20" fill="#9eafc2" text-anchor="middle" font-family="Consolas, Menlo, monospace">chr</text>
<text x="267" y="112" font-size="20" fill="#9eafc2" text-anchor="middle" font-family="Consolas, Menlo, monospace">chr</text>
<text x="423" y="112" font-size="20" fill="#9eafc2" text-anchor="middle" font-family="Consolas, Menlo, monospace">num</text>
