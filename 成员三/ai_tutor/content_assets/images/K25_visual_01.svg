<text x="423.0" y="502.0" font-size="22" fill="#79bdf1" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">score</text>
<rect x="36" y="524" width="150" height="48" rx="8" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="111.0" y="556.0" font-size="22" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">"S01"</text>
