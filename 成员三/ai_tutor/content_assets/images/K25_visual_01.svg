<text x="423.0" y="156.0" font-size="22" fill="#79bdf1" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">score</text>
<rect x="36" y="178" width="150" height="48" rx="8" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
