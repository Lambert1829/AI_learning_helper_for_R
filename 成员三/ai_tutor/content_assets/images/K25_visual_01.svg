<text x="58" y="664" font-size="28" fill="#79bdf1" font-weight="700">先检查再计算</text>
<text x="58" y="706" font-size="25" fill="#b7c5d4">str() 看类型 · summary() 看分布 · dim() 看规模</text>
</g>
